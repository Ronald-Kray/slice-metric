us, and the score</text><rect x="14" y="58" width="525" height="187.5" fill="#D4D4D2" stroke="#999" stroke-width="0.8"/><use href="#cf" transform="translate(14,58.00) scale(1.25)" fill="none" stroke="#D55E00" stroke-width="5" stroke-opacity="0.25"/><use href="#ca" transform="translate(14,60.50) scale(1.25)" fill="none" stroke="#0072B2" stroke-width="9" stroke-opacity="0.2"/><use href="#cb" transform="translate(14,60.50) scale(1.25)" fill="none" stroke="#0072B2" stroke-width="9" stroke-opacity="0.2"/><line x1="87.8" y1="89.2" x2="106.5" y2="94.2" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><line x1="315.2" y1="166.8" x2="327.8" y2="170.5" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><line x1="96.5" y1="149.2" x2="122.8" y2="148" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><line x1="60.2" y1="159.2" x2="74" y2="160.5" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><line x1="482.8" y1="194.2" x2="504" y2="201.8" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><line x1="204" y1="213" x2="224" y2="206.8" stroke="#0072B2" stroke-width="3.75" stroke-opacity="0.2"/><use href="#ca" transform="translate(14,58.00) scale(1.25)" fill="none" stroke="#009E73" stroke-width="2.4"/><use href="#cb" transform="translate(14,58.00) scale(1.25)" fill="none" stroke="#009E73" stroke-width="2.4"/><rect x="14" y="257" width="13" height="13" fill="#009E73"/><text x="33" y="268" font-size="13">matched a1</text><text x="640" y="90" font-size="15">a2 = Lg − a1 = 36 px missed</text><text x="640" y="120" font-size="15">a3 = Lp − a1 = 107 px spurious</text><text x="640" y="158" font-size="16" font-weight="bold">SLICE = a1 / (a1 + a2 + a3)</text><text x="640" y="188" font-size="18" fill="#0072B2" font-weight="bold">= 356 / 499 = 0.71</text></g></svg>
